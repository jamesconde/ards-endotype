# Pre-registered cohort parameters. SPEC.md §4.3, I4.
#
# FROZEN on day 0, before any data was read. Any edit after Layer 2 modelling
# begins must be logged in DECISIONS.md with its trigger, or the freeze means
# nothing. The one pre-authorised change is the S/F relaxation rule below,
# which is written down here precisely so that taking it is not a judgement
# call made after seeing a disappointing cohort size.

cohort:
  name: hypoxemic_respiratory_failure
  # NOT ARDS. §6.3: no imaging, no PEEP, no ventilation flag on this path.
  # This name propagates into every table, figure caption and variable name.
  label_for_figures: "Hypoxemic respiratory failure (SpO2/FiO2 surrogate)"

inclusion:
  min_age: 18
  min_iculos_hours: 24
  sf_ratio_threshold: 235       # surrogate for P/F <= 200 (moderate-severe)
  require_nonnull_fio2: true    # itself a weak proxy for oxygen support (§4.3)

# Physiological validity window for FiO2, added day 1 after observing the data
# (DECISIONS.md D10). Room air is 0.209 and pure oxygen is 1.0; anything outside
# is a recording error. 0.29% of set A's FiO2 values fall outside it, including
# 81 zeros (S/F -> infinity) and 2 values above 1.0 (which deflate S/F and would
# falsely admit a patient as severely hypoxemic). Hours outside the window are
# dropped as S/F candidates; the patient is not excluded.
fio2_validity:
  min: 0.21
  max: 1.0
  note: "values of exactly 0.20 are treated as out-of-range rounding of room air"

exclusion:
  max_qualifying_hour: 168      # qualifying hour beyond ICU hour 168
  o2sat_saturation_cutoff: 97   # S/F is uninformative once the oximeter saturates

# Pre-authorised relaxation, §4.3. Taking this is not discretionary: if the
# primary threshold yields < min_cohort_n, relax once, log it, and move on.
# Do not relax a second time, and do not tune the threshold to a nicer number.
relaxation:
  min_cohort_n: 1500
  relaxed_sf_threshold: 315     # surrogate for P/F <= 300 (mild-ARDS boundary)
  max_relaxations: 1

index_time:
  definition: first_qualifying_hour
  static_window_hours: 24       # T0 .. T0+24h
  longitudinal_window_hours: 72 # T0 .. T0+72h
  bin_hours: 6                  # -> 12 timesteps
  aggregations: [min, max, mean, last]
  emit_missingness_mask: true   # §4.4 — never forward-fill without a mask

covariates_not_features:
  # §4.1: clustering on these recovers unit assignment, not biology.
  - Unit1
  - Unit2
  - hospital_system

endpoints:
  primary: sepsis_onset          # SepsisLabel, Sepsis-3, shifted 6h early (read Reyna 2020)
  secondary: iculos_at_final_record   # weak, censored; never a headline (§4.4)
  mortality_source: eicu_demo    # the ONLY mortality in Layer 2 (§4.4, §6.1)
  # Explicitly forbidden: a composite "severity outcome" from organ-dysfunction
  # variables presented as though it were mortality. §6.1, "what NOT to do".

static_features:
  demographics: [Age, Gender, HospAdmTime]
  labs: [WBC, Platelets, Creatinine, Bilirubin_total, HCO3, Lactate, pH,
         BaseExcess, BUN, Glucose, PTT, Fibrinogen]
  derived: [sf_ratio, MAP]
  # HCO3 carries the Sinha 2020 comparator and the §5 cross-layer link.

# Frozen day 1 after the A/B coverage scan (DECISIONS.md D12).
# Variables whose patient-level coverage differs by < 10 percentage points
# between the two hospital systems, with both above 50%. Fitting the transfer
# experiment on THIS set means a performance drop on B is attributable to case
# mix rather than to charting behaviour. The full static_features set above is
# retained for the deliberately-naive comparison.
transferable_features:
  demographics: [Age, Gender, HospAdmTime]
  vitals: [HR, O2Sat, Resp, MAP, Temp, SBP]
  labs: [Glucose, Potassium, Creatinine, BUN, WBC, Platelets, Hgb, Hct]
  # DBP is EXCLUDED despite being a vital: 63.7% in A vs 99.9% in B.
  # The blood-gas block (HCO3, Chloride, BaseExcess, pH, PaCO2) is excluded
  # outright — see D12. HCO3 is 97.4% in A and 2.1% in B.

# FiO2 is a special case: 58.9% in A vs 29.1% in B. It is not a model feature,
# it defines the cohort, so the gap changes who is enrolled at each site rather
# than what the model sees. Reported in the attrition table for both systems.

clustering:
  k_range: [2, 3, 4]
  n_restarts: 100
  selection_criterion: BIC
  seed: 42

splits:
  discovery: setA
  external: setB
  # §4.7: a final holdout touched exactly once, at the end of the refinement loop.
  refinement_holdout_frac: 0.20
  seed: 42
