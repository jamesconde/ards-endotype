# PRE-REGISTERED pathway gene sets. SPEC.md §3.6. Frozen constraint I4.
#
# ---------------------------------------------------------------------------
# FROZEN 2026-08-27, day 1, BEFORE any clustering has been run and before any
# GEO or Olink data has been loaded. Written from SPEC.md §3.6 and §3.7 only.
#
# DO NOT EDIT THIS FILE AFTER §3.4 HAS RUN.
#
# The freeze is the whole point. §6.14 states it plainly: "do not expand the
# gene set until it separates." An edit made after seeing a result renders the
# result uninterpretable, and the ordering of commits is what makes that
# checkable by someone who does not trust us. If an edit becomes genuinely
# necessary, it goes in DECISIONS.md with its trigger, and the pre-edit result
# is reported alongside the post-edit one.
# ---------------------------------------------------------------------------

meta:
  frozen_on: 2026-08-27
  frozen_before: "§3.4 unsupervised discovery; no expression data loaded at freeze time"
  source: "SPEC.md §3.6 (transcript space) and §3.7 (protein space)"
  scoring_method: ssGSEA          # gseapy.ssgsea; see DECISIONS.md D1 for why not GSVA
  comparison_test: "Wilcoxon rank-sum + Cliff's delta, per SPEC.md §3.6"
  multiple_testing: benjamini_hochberg

# ---------------------------------------------------------------------------
# READ BEFORE INTERPRETING ANY SCORE FROM THIS FILE
# ---------------------------------------------------------------------------
# A whole-blood transcriptome cannot measure whether p38 is ACTIVE. The
# p38alpha:MK2 axis is regulated post-translationally: MK2 is activated by
# phosphorylation, and its principal effect is phosphorylating tristetraprolin
# (TTP/ZFP36), which changes the STABILITY of TNF and other cytokine mRNAs.
# None of that is visible in MAPK14 or MAPKAPK2 transcript abundance, which are
# largely constitutive.
#
# What transcriptomics sees is the downstream consequence — elevated TNF, IL6,
# CXCL8, IL1B — which is equally downstream of NF-kB and most other
# inflammatory inputs, and therefore NOT specific to p38.
#
# THE EXPECTED RESULT IS A NULL, AND REPORTING IT IS A PASS (constraint I5).
# If the p38 set separates endotypes no better than INFLAMMATORY_RESPONSE, the
# correct conclusion is: "the hyperinflammatory class is broadly inflammatory;
# blood transcriptome cannot resolve whether p38/MK2 specifically dominates."
# Write exactly that. Phosphoproteomics is the assay that would answer it, and
# no public cohort here provides it.
# ---------------------------------------------------------------------------

primary:
  p38_mk2_axis:
    description: >
      Mechanism-specific p38alpha/MK2 set — the axis GEn1E's lead asset
      modulates. Transcript abundance is an indirect and weak proxy for its
      activity; see the block above.
    report_individually: [ZFP36]
    rationale_for_individual_report: >
      ZFP36 (tristetraprolin) is the mechanistic centrepiece. MK2 phosphorylates
      TTP, which stabilises TNF mRNA. It is the single gene most specific to
      this axis as opposed to generic inflammation, so it is reported on its own
      as well as inside the set score.
    genes:
      # kinases and direct effectors of the cascade
      - MAPK14        # p38alpha itself
      - MAPKAPK2      # MK2
      - MAPKAPK3
      - MAPKAPK5
      - MAP2K3        # upstream MKK3
      - MAP2K6        # upstream MKK6
      - MAP3K7        # TAK1
      # substrates and RNA-stability machinery
      - HSPB1         # HSP27, canonical MK2 substrate
      - ZFP36         # tristetraprolin
      - ELAVL1        # HuR, opposing TTP in ARE-mediated mRNA stability
      # negative regulators
      - DUSP1
      - DUSP10
      # downstream output — NOT specific to p38, included for completeness
      - TNF
      - IL6
      - CXCL8
      - IL1B
      - PTGS2

# ---------------------------------------------------------------------------
# Comparators exist to answer one question: is the p38 score just "inflammation"?
# Without them the primary score is uninterpretable, so they are mandatory
# rather than optional (§3.6).
# ---------------------------------------------------------------------------
comparators:
  TNFA_SIGNALING_VIA_NFKB:
    source: MSigDB Hallmark
    role: >
      The main confound. TNF/NF-kB drives the same downstream cytokines. If the
      p38 set does not beat this, p38-specific dominance is not demonstrated.
  INFLAMMATORY_RESPONSE:
    source: MSigDB Hallmark
    role: >
      Generic inflammation. This is the benchmark the p38 score has to clear,
      and the null hypothesis §3.6 expects to hold.
  INTERFERON_ALPHA_RESPONSE:
    source: MSigDB Hallmark
    role: >
      NEGATIVE CONTROL. Should NOT track the p38 endotype specifically. If it
      separates as strongly as the p38 set, the separation is a general
      transcriptional-activation artifact rather than pathway-specific signal,
      and nothing in this section can be interpreted.

# ---------------------------------------------------------------------------
# Protein space — SPEC.md §3.7. The PRIMARY venue for this arm, because
# measured cytokine output is a closer (though still indirect) readout than
# transcript abundance.
# ---------------------------------------------------------------------------
protein_space:
  p38_axis_proxy:
    description: >
      Olink Explore 1536 assays used as a p38-axis output proxy. Same
      comparator discipline as the transcript arm: these are downstream of many
      inputs, so a positive result is "consistent with" and not "evidence of".
    assays:
      - IL6
      - TNF
      - CXCL8
      - IL1B
      - CCL2
      - IL10
      - TNFRSF1A
      - IL18
      - HGF
      - LCN2
  caveats:
    - >
      NPX is a relative log2 scale, not a concentration. Scores are comparable
      WITHIN this cohort and are not portable across cohorts or to any
      fixed-coefficient published model. See DECISIONS.md D3.
    - >
      Proteins below the limit of detection in more than 50% of day-0 samples
      are dropped before scoring (§3.2). Report how many of the assays above
      survive that filter — if a substantial share do not, say so rather than
      scoring a depleted set silently.

# ---------------------------------------------------------------------------
# Pre-committed interpretation rules, so the conclusion is not chosen after
# seeing the numbers.
# ---------------------------------------------------------------------------
interpretation_rules:
  - >
    If the p38 set's Cliff's delta does not exceed INFLAMMATORY_RESPONSE's,
    conclude that the hyperinflammatory class is broadly inflammatory and that
    the assay cannot resolve p38-specific dominance. This is the expected
    outcome and is reported as a finding, not a failure.
  - >
    If INTERFERON_ALPHA_RESPONSE separates as strongly as the p38 set, treat
    the entire section as uninformative and say so.
  - >
    Never report the p38 score without its comparators in the same figure.
  - >
    Do not expand, contract or re-weight any set in this file to improve
    separation.
